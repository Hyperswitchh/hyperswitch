[package]
name = "hs-daemon"
description = "hyperswitchd: the Hyperswitch host daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hyperswitchd"
path = "src/main.rs"

[features]
default = []
libvirt = ["hs-core/libvirt"]
evdev = ["hs-core/evdev"]
# Everything needed on a real Hyperswitch host.
host = ["libvirt", "evdev"]

[lints]
workspace = true

[dependencies]
hs-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
