# Hyperswitch host image, build with: cd distro && mkosi -f build
# Produces a bootable UEFI disk image; wrap it with the installer to make the ISO.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=hyperswitch
ImageVersion=0.1.0

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=quiet intel_iommu=on amd_iommu=on iommu=pt kvm.ignore_msrs=1
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        udev
        dbus
        qemu-system-x86
        qemu-utils
        ovmf
        libvirt-daemon-system
        libvirt0
        sway
        foot
        pipewire
        pipewire-pulse
        wireplumber
        looking-glass-client
        sudo
ExtraTrees=rootfs
# Release binaries copied in by the build script:
#   rootfs/usr/bin/{hyperswitchd,hyperswitch,hyperswitch-check}
PostInstallationScripts=postinst.sh
