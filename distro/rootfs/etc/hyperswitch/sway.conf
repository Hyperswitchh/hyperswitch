# Kiosk compositor: no bar, no gaps, every guest fullscreen in its own workspace.
# hyperswitchd's on_focus hook brings the right one forward.
default_border none
bar mode invisible
focus_follows_mouse no

# One Looking Glass client per passthrough guest (app_id lg-<id>).
exec looking-glass-client -f /dev/kvmfr0 -F win:noScreensaver=yes app:shmFile=/dev/kvmfr0 wayland:appId=lg-win11 input:grabKeyboard=no
# SPICE guests (virtual GPU)
exec remote-viewer --full-screen --title=lg-ubuntu spice://127.0.0.1:5901

for_window [app_id="lg-.*"] fullscreen enable
